# Smoke-test config: runs the whole pipeline on generated Criteo-like data.
# Generate data first:  python scripts/make_synthetic_data.py
seed: 42

paths:
  raw_dir: data/synthetic/raw
  processed_dir: data/synthetic/processed
  artifacts_dir: artifacts/synthetic

data:
  file_pattern: "day_{day}.gz"
  max_rows_per_day: null
  chunksize: 100000

split:
  train_days: [0, 1, 2]
  val_days: [3]
  test_days: [4]

features:
  n_hash_features: 262144
  min_category_count: 3

models:
  logreg:
    C: 0.1
    max_iter: 100
  lightgbm:
    n_estimators: 200
    learning_rate: 0.1
    num_leaves: 31
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    early_stopping_rounds: 20

evaluation:
  n_calibration_bins: 15
